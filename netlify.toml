# The site is the Next.js app in web/ (Netlify's Next.js runtime is detected automatically).
# The previous React site (client/) stays in the repo for reference; to roll back, revert the
# merge of this file or use Netlify > Deploys > "Publish deploy" on an earlier deploy.
[build]
  base    = "web"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Responses get their security headers (CSP with a nonce, HSTS ...) from the application itself
# (web/next.config.ts and web/src/proxy.ts); only static files are tuned here.
[[headers]]
  for = "/_next/static/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The retired service worker must always be re-checked, never served from a cache.
[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Files in web/public are served by Netlify's CDN, which ignores the headers() of next.config.ts for them (measured on
# the live site 2026-10-06: `public,max-age=0,must-revalidate`, so every visit re-asked the server for every photo).
# The same values as next.config.ts, written where Netlify reads them. Two rules can match one file (/images/* and
# /images/nazareth-media/*): both values are safe for every file they cover, so it does not matter which one wins.
# docs/INFRASTRUCTURE.md says how to check the result on a deploy preview. tests/unit/netlify-config.test.ts fails
# when a top-level folder of public/ is left without a rule.
[[headers]]
  for = "/images/*"
    [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The pre-built AVIF/WebP files of the licensed photos: a new crop gets a new id (docs/MEDIA.md), so a month is safe.
[[headers]]
  for = "/images/nazareth-media/*"
    [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/videos/*"
    [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=604800"

[[headers]]
  for = "/sounds/*"
    [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Optimised product photos (/_next/image): no rule here. A [[headers]] rule for /_next/image* was tried (2026-10-06)
# and measured on production on 2026-10-07: Netlify's Image CDN ignores it and keeps `private,max-age=0`, because it
# follows the Cache-Control of the original file, and Firebase serves the originals with `private, max-age=0`. The fix
# is the Firebase metadata (owner step: docs/PERFORMANCE.md, "Product photos").

# One address for the site: the free *.netlify.app name answers the same pages as the real domain (measured: HTTP 200),
# which splits search engines and links between two hosts. Only this exact host is redirected; deploy previews
# (deploy-preview-N--nazarethholycross.netlify.app) and branch deploys keep working.
[[redirects]]
  from = "https://nazarethholycross.netlify.app/*"
  to = "https://nazarethholycross.com/:splat"
  status = 301
  force = true

# http://www.… took two hops (301 to https://www.…, then 301 to the apex). One hop to the canonical address instead.
# (https://www.… -> apex is Netlify's primary-domain redirect and is already one hop.) Check on the live site after the
# deploy: curl -sI http://www.nazarethholycross.com/en/shop must answer 301 with location https://nazarethholycross.com/en/shop.
[[redirects]]
  from = "http://www.nazarethholycross.com/*"
  to = "https://nazarethholycross.com/:splat"
  status = 301
  force = true

# Next.js on Netlify is served by the official runtime (server handler + routing); named
# explicitly so the build does not depend on auto-detection.
[[plugins]]
  package = "@netlify/plugin-nextjs"
