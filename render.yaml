services:
  - type: web
    name: nazareth-holy-cross-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService: port
      # PayPal API mode. Keep 'sandbox' until CLIENT_ID/CLIENT_SECRET are Live credentials,
      # then set both this and the client's REACT_APP_PAYPAL_CLIENT_ID to the live values together.
      - key: ENVIRONMENT
        value: sandbox
      - key: DATABASEURL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
