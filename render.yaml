services:
  - type: web
    name: nazareth-holy-cross-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService: port
      # PayPal API mode: 'sandbox' or 'production'. Set in the Render dashboard (not here), together
      # with Live CLIENT_ID/CLIENT_SECRET and the site's REACT_APP_PAYPAL_CLIENT_ID on Netlify.
      # The server falls back to 'sandbox' when it is unset.
      - key: ENVIRONMENT
        sync: false
      # 'true' = /order/newOrder and /candle/lightACandle refuse requests without a PayPal-verified payment (docs/SECURITY.md).
      # The public site (web/) always sends paypalOrderId and the old CRA site is retired: set it to 'true' in the Render
      # dashboard (the value here only applies when the service is synced from this blueprint).
      - key: REQUIRE_PAYMENT_PROOF
        value: 'false'
      # The server builds the indexes its models declare when it starts (docs/DATABASE.md section 5): the payment ledger depends on them.
      # AUTO_INDEX=false turns that off (large database only: then run server/scripts/ensure-indexes.js --apply).
      - key: DATABASEURL
        sync: false
      # Signs the dashboard's sessions and derives the TOTP-encryption and audit-hash keys: never rotate it casually
      # (docs/ADMIN.md). ADMIN_PASSWORD is no longer used (the legacy sign-in was removed): delete it in the dashboard.
      - key: JWT_SECRET
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      # Browser origin(s) of the new admin dashboard, comma-separated (docs/ADMIN.md). Without it the dashboard
      # cannot call the API from a browser.
      - key: ADMIN_ORIGINS
        sync: false
      # Live broadcasting through Cloudflare Stream (docs/LIVE.md section 6): the account id and an API token with
      # Stream: Edit on that account only. Secrets: set them in the Render dashboard, never here. Without both the
      # dashboard's Live page says "not set up yet".
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_STREAM_API_TOKEN
        sync: false
      # Not listed, on purpose (both have working defaults in config/env.js; set them in the Render dashboard only to change them):
      #   ADMIN_APP_URL          the dashboard address in the password-reset e-mail (default https://admin.nazarethholycross.com)
      #   ADMIN_BOOTSTRAP_EMAILS who may create the first owner by e-mail while no account exists (default
      #                          nazarethholycross@gmail.com; empty turns it off). docs/ADMIN.md 1.1 and 3.6.
