services:
  - type: web
    name: nazareth-holy-cross-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService: port
      # PayPal API mode: 'sandbox' or 'production'. Set in the Render dashboard (not here), together
      # with Live CLIENT_ID/CLIENT_SECRET and the site's REACT_APP_PAYPAL_CLIENT_ID on Netlify.
      # The server falls back to 'sandbox' when it is unset.
      - key: ENVIRONMENT
        sync: false
      # 'true' = /order/newOrder refuses orders without a PayPal-verified payment (docs/SECURITY.md).
      # Switch on once every client sends paypalOrderId (the new site does; the old CRA site does not).
      - key: REQUIRE_PAYMENT_PROOF
        value: 'false'
      - key: DATABASEURL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
