# Weekly dependency updates as pull requests (they must pass CI like any other change).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
